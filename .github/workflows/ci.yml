name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  backend:
    name: Backend (build, test, coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore (locked)
        run: dotnet restore Merp.slnx --locked-mode

      - name: Build
        run: dotnet build Merp.slnx --no-restore -warnaserror

      # Integration tests start PostgreSQL and RabbitMQ with Testcontainers (Docker is available on the runner).
      - name: Test
        run: >-
          dotnet test --solution Merp.slnx --no-build
          --results-directory TestResults
          --report-trx
          --coverlet --coverlet-output-format cobertura

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/
          if-no-files-found: warn

  web:
    name: Web (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Detect web project
        id: detect
        working-directory: .
        run: echo "exists=$([ -f web/package-lock.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.detect.outputs.exists == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - if: steps.detect.outputs.exists == 'true'
        run: npm ci

      - if: steps.detect.outputs.exists == 'true'
        run: npm run lint

      - if: steps.detect.outputs.exists == 'true'
        run: npm run typecheck

      - if: steps.detect.outputs.exists == 'true'
        run: npm test

      - if: steps.detect.outputs.exists == 'true'
        run: npm run build

  security:
    name: Security (vulnerable dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: NuGet vulnerabilities
        run: |
          dotnet restore Merp.slnx --locked-mode
          dotnet list Merp.slnx package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::Vulnerable NuGet packages found"
            exit 1
          fi

      - uses: actions/setup-node@v4
        if: hashFiles('web/package-lock.json') != ''
        with:
          node-version: 22

      - name: npm audit
        if: hashFiles('web/package-lock.json') != ''
        working-directory: web
        run: npm audit --audit-level=high
