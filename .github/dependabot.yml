version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      microsoft:
        patterns: ["Microsoft.*", "System.*"]
      opentelemetry:
        patterns: ["OpenTelemetry*", "Npgsql.OpenTelemetry"]
      ef-npgsql:
        patterns: ["Npgsql*", "EFCore.*"]
      hangfire:
        patterns: ["Hangfire*"]
      health-checks:
        patterns: ["AspNetCore.HealthChecks.*"]
      testing:
        patterns: ["xunit*", "coverlet*", "Shouldly", "NSubstitute", "Testcontainers*", "Respawn", "Bogus", "NetArchTest.Rules", "Mono.Cecil"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react*"]
      antd:
        patterns: ["antd", "@ant-design/*"]
      lint:
        patterns: ["eslint*", "@eslint/*", "typescript-eslint", "prettier"]
      test:
        patterns: ["vitest", "@vitest/*", "@testing-library/*", "jsdom", "@playwright/*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
